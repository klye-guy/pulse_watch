# Example reverse proxy for Pulsewatch self-host.
# Install (Debian/Ubuntu):
#   sudo cp /opt/pulsewatch/packaging/linux/nginx-pulsewatch.conf /etc/nginx/sites-available/pulsewatch
#   sudo ln -sf /etc/nginx/sites-available/pulsewatch /etc/nginx/sites-enabled/pulsewatch
#   sudo nginx -t && sudo systemctl reload nginx
# Then set BETTER_AUTH_URL to the public URL and preferably HOST=127.0.0.1 in
# /etc/pulsewatch/pulsewatch.env so only nginx can reach the Node listener.
#
# X-Real-IP is overwritten (not appended) so Better Auth can rate-limit per client.

upstream pulsewatch_node {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Replace with your TLS server block (443) for production HTTPS.
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://pulsewatch_node;
    }
}
