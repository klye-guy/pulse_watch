# Dependabot version updates + (with repo settings) security updates.
# Security alerts / automated security fixes are enabled at the repository
# settings level; this file drives scheduled version update PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    # Group noisy minor/patch bumps; leave major alone for review.
    groups:
      npm-production-minor-patch:
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
      npm-development-minor-patch:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
